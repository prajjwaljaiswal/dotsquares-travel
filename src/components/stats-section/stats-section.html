<!-- Company Stats & Trust Indicators Section -->
<!-- Include this markup inside the About Us page. Requires stats-section.css and stats-section.js -->
<section class="stats-section" aria-label="Company statistics and trust indicators">
  <div class="stats-section__inner">
    <div class="stats-section__header">
      <h2 class="stats-section__title">Why Travellers Trust Us</h2>
      <p class="stats-section__subtitle">
        Numbers that reflect our commitment to unforgettable journeys.
      </p>
    </div>

    <div class="stats-section__grid">
      <div class="stat-card">
        <span class="stat-card__number" data-counter="150" data-suffix="+">0</span>
        <span class="stat-card__label">Destinations Covered</span>
      </div>

      <div class="stat-card">
        <span class="stat-card__number" data-counter="25000" data-suffix="+">0</span>
        <span class="stat-card__label">Happy Travellers</span>
      </div>

      <div class="stat-card">
        <span class="stat-card__number" data-counter="12" data-suffix="+">0</span>
        <span class="stat-card__label">Years of Experience</span>
      </div>

      <div class="stat-card">
        <span class="stat-card__number" data-counter="98" data-suffix="%">0</span>
        <span class="stat-card__label">Customer Satisfaction</span>
      </div>
    </div>

    <div class="stats-section__badges" aria-label="Trust badges">
      <div class="trust-badge">
        <span class="trust-badge__icon" aria-hidden="true">&#128274;</span>
        <span class="trust-badge__label">Secure Booking</span>
      </div>
      <div class="trust-badge">
        <span class="trust-badge__icon" aria-hidden="true">&#9742;</span>
        <span class="trust-badge__label">24/7 Support</span>
      </div>
      <div class="trust-badge">
        <span class="trust-badge__icon" aria-hidden="true">&#127942;</span>
        <span class="trust-badge__label">Award Winning</span>
      </div>
      <div class="trust-badge">
        <span class="trust-badge__icon" aria-hidden="true">&#9989;</span>
        <span class="trust-badge__label">Certified Partner</span>
      </div>
    </div>
  </div>
</section>
