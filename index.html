<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dotsquares Travel</title>
  <link rel="stylesheet" href="css/nav.css" />
</head>
<body>
  <header class="site-header">
    <div class="site-header-inner">
      <a href="/" class="site-logo">Dotsquares Travel</a>

      <nav class="desktop-nav" aria-label="Primary navigation">
        <ul class="desktop-nav-list">
          <li><a href="/">Home</a></li>
          <li><a href="/destinations">Destinations</a></li>
          <li><a href="/tours">Tours</a></li>
          <li><a href="/about">About</a></li>
          <li><a href="/contact">Contact</a></li>
        </ul>
        <a href="/book-now" class="cta-button">Book Now</a>
      </nav>

      <button
        class="hamburger"
        id="hamburger-btn"
        type="button"
        aria-expanded="false"
        aria-controls="mobile-menu"
        aria-label="Toggle navigation menu"
      >
        <span class="hamburger-box">
          <span class="hamburger-inner"></span>
        </span>
      </button>
    </div>

    <div class="mobile-menu-overlay" id="mobile-menu-overlay"></div>

    <nav class="mobile-menu" id="mobile-menu" aria-hidden="true" aria-label="Mobile navigation">
      <ul class="mobile-menu-list">
        <li><a href="/" class="mobile-menu-link">Home</a></li>
        <li><a href="/destinations" class="mobile-menu-link">Destinations</a></li>
        <li><a href="/tours" class="mobile-menu-link">Tours</a></li>
        <li><a href="/about" class="mobile-menu-link">About</a></li>
        <li><a href="/contact" class="mobile-menu-link">Contact</a></li>
      </ul>
      <a href="/book-now" class="mobile-menu-cta">Book Now</a>
    </nav>
  </header>

  <main>
    <!-- page content -->
  </main>

  <script src="js/nav.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
